apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-crud
  labels:
    app: spring-boot-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-crud
  template:
    metadata:
      labels:
        app: spring-boot-crud
    spec:
      containers:
        - name: spring-boot-crud
          image: spring-boot-crud:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
