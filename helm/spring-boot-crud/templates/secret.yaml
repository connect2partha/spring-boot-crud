apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spring-boot-crud.fullname" . }}-secret
  labels:
    {{- include "spring-boot-crud.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.secret.datasourceUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.datasourcePassword | quote }}
