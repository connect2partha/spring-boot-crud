name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test
        run: mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: target/*.jar

      - name: Create Pull Request
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --head "${{ github.ref_name }}" \
            --base main \
            --title "PR: ${{ github.ref_name }}" \
            --body "Auto-generated PR from branch \`${{ github.ref_name }}\`." \
            || echo "PR already exists, skipping."

  robot-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: target

      - name: Start application
        run: |
          java -jar target/*.jar &
          echo "Waiting for app to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Robot Framework
        run: pip install -r tests/requirements.txt

      - name: Run Robot Framework tests
        run: robot --outputdir tests/results tests/product_api.robot

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: robot-results
          path: tests/results/

  deploy:
    runs-on: self-hosted
    needs: robot-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: docker build -t spring-boot-crud:latest .

      - name: Load image into cluster
        run: minikube image load spring-boot-crud:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment/spring-boot-crud
          kubectl rollout status deployment/spring-boot-crud --timeout=120s
